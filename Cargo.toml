[package]
name = "syncplayer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Experimental clock-synchronised local-media playback"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arturormk/syncplayer"
readme = "README.md"
keywords = ["gstreamer", "multimedia", "synchronization", "video"]
categories = ["multimedia::video"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gstreamer = "0.25"
gstreamer-net = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
